<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1300" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="45%" stop-color="#1c1330"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <pattern id="brick" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#2e2440"/>
      <rect width="20" height="10" fill="#352a49"/>
      <rect x="0" y="0" width="20" height="1" fill="#221a33"/>
      <rect x="0" y="10" width="20" height="1" fill="#221a33"/>
      <rect x="10" y="0" width="1" height="10" fill="#221a33"/>
      <rect x="0" y="10" width="1" height="10" fill="#221a33"/>
    </pattern>
    <pattern id="brickTower" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3a2d52"/>
      <rect width="20" height="10" fill="#41335c"/>
      <rect x="0" y="0" width="20" height="1" fill="#2a2140"/>
      <rect x="0" y="10" width="20" height="1" fill="#2a2140"/>
      <rect x="10" y="0" width="1" height="10" fill="#2a2140"/>
      <rect x="0" y="10" width="1" height="10" fill="#2a2140"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="1300" fill="url(#dusk)"/>

  <!-- 별 -->
  <g fill="#e8d4a0" opacity="0.7">
    <rect x="30" y="40" width="3" height="3"/>
    <rect x="90" y="90" width="2" height="2"/>
    <rect x="340" y="60" width="3" height="3"/>
    <rect x="300" y="140" width="2" height="2"/>
    <rect x="60" y="180" width="2" height="2"/>
    <rect x="360" y="220" width="3" height="3"/>
  </g>

  <!-- 좌측 보조 타워 -->
  <g>
    <rect x="30" y="220" width="70" height="1000" fill="url(#brick)"/>
    <g fill="#3a2d52">
      <rect x="30" y="200" width="14" height="20"/>
      <rect x="58" y="200" width="14" height="20"/>
      <rect x="86" y="200" width="14" height="20"/>
    </g>
  </g>
  <!-- 우측 보조 타워 -->
  <g>
    <rect x="300" y="260" width="70" height="960" fill="url(#brick)"/>
    <g fill="#3a2d52">
      <rect x="300" y="240" width="14" height="20"/>
      <rect x="328" y="240" width="14" height="20"/>
      <rect x="356" y="240" width="14" height="20"/>
    </g>
  </g>

  <!-- 중앙 메인 타워 -->
  <rect x="110" y="80" width="180" height="1140" fill="url(#brickTower)"/>

  <!-- 흉벽(크레넬레이션) -->
  <g fill="#41335c">
    <rect x="110" y="60" width="18" height="24"/>
    <rect x="146" y="60" width="18" height="24"/>
    <rect x="182" y="60" width="18" height="24"/>
    <rect x="218" y="60" width="18" height="24"/>
    <rect x="254" y="60" width="18" height="24"/>
    <rect x="272" y="60" width="18" height="24"/>
  </g>

  <!-- 깃발 -->
  <rect x="196" y="10" width="4" height="50" fill="#8a6a37"/>
  <path d="M200 14 L236 24 L200 34 Z" fill="#c9a35a"/>

  <!-- ===== 창문 6개 층 (아래로 스크롤하며 등장) ===== -->
  <!-- Floor 1 (공실) y~140 -->
  <g class="pixel-window" data-floor="vacant">
    <rect x="170" y="140" width="26" height="34" fill="#191225"/>
    <rect x="174" y="144" width="18" height="26" fill="#241a33"/>
    <rect x="204" y="140" width="26" height="34" fill="#191225"/>
    <rect x="208" y="144" width="18" height="26" fill="#241a33"/>
  </g>

  <!-- Floor 2 — 빙그레 (실제 콘텐츠) y~340 -->
  <g class="pixel-window" data-floor="binggrae" data-slot="floor-binggrae">
    <rect x="150" y="340" width="34" height="44" fill="#3a2712"/>
    <rect x="155" y="345" width="24" height="34" fill="#f4c968"/>
    <rect x="216" y="340" width="34" height="44" fill="#3a2712"/>
    <rect x="221" y="345" width="24" height="34" fill="#f4c968"/>
    <!-- 픽셀 캐릭터 실루엣 -->
    <g fill="#241a33">
      <rect x="163" y="358" width="8" height="8"/>
      <rect x="161" y="366" width="12" height="12"/>
      <rect x="229" y="356" width="8" height="10"/>
      <rect x="227" y="366" width="12" height="12"/>
    </g>
  </g>

  <!-- Floor 3 (공실) y~540 -->
  <g class="pixel-window" data-floor="vacant">
    <rect x="170" y="540" width="26" height="34" fill="#191225"/>
    <rect x="174" y="544" width="18" height="26" fill="#241a33"/>
    <rect x="204" y="540" width="26" height="34" fill="#191225"/>
    <rect x="208" y="544" width="18" height="26" fill="#241a33"/>
  </g>

  <!-- Floor 4 — SNS 캠페인 (실제 콘텐츠) y~740 -->
  <g class="pixel-window" data-floor="mermaid" data-slot="floor-mermaid">
    <rect x="150" y="740" width="34" height="44" fill="#123a3a"/>
    <rect x="155" y="745" width="24" height="34" fill="#6fd8d8"/>
    <rect x="216" y="740" width="34" height="44" fill="#123a3a"/>
    <rect x="221" y="745" width="24" height="34" fill="#6fd8d8"/>
    <g fill="#0d2a2a">
      <rect x="163" y="758" width="8" height="8"/>
      <rect x="161" y="766" width="12" height="14"/>
      <rect x="229" y="758" width="8" height="8"/>
      <rect x="227" y="766" width="12" height="14"/>
    </g>
  </g>

  <!-- Floor 5 (공실) y~940 -->
  <g class="pixel-window" data-floor="vacant">
    <rect x="170" y="940" width="26" height="34" fill="#191225"/>
    <rect x="174" y="944" width="18" height="26" fill="#241a33"/>
    <rect x="204" y="940" width="26" height="34" fill="#191225"/>
    <rect x="208" y="944" width="18" height="26" fill="#241a33"/>
  </g>

  <!-- Floor 6 (공실, "다음 입주 예정") y~1120 -->
  <g class="pixel-window" data-floor="vacant">
    <rect x="170" y="1120" width="26" height="34" fill="#191225"/>
    <rect x="174" y="1124" width="18" height="26" fill="#241a33"/>
    <rect x="204" y="1120" width="26" height="34" fill="#191225"/>
    <rect x="208" y="1124" width="18" height="26" fill="#241a33"/>
  </g>

  <!-- 정문 -->
  <rect x="178" y="1180" width="44" height="70" fill="#191225"/>
  <rect x="183" y="1186" width="34" height="64" fill="#241a33"/>
  <rect x="196" y="1186" width="8" height="64" fill="#191225"/>

  <!-- 계단 -->
  <rect x="150" y="1250" width="100" height="10" fill="#41335c"/>
  <rect x="140" y="1260" width="120" height="10" fill="#352a49"/>
  <rect x="130" y="1270" width="140" height="10" fill="#2e2440"/>

  <!-- 바닥 -->
  <rect x="0" y="1280" width="400" height="20" fill="#0b0b12"/>
</svg>
