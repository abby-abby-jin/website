  <path d="M200 14 L236 24 L200 34 Z" fill="#c9a35a"/>

  <!-- ===== 컷어웨이 층 6개 (내부가 보이는 구조) ===== -->

  <!-- Room 1 (공실) y 84-267 -->
  <g class="pixel-window" data-floor="vacant">
    <rect x="114" y="84" width="172" height="177" fill="#241a33"/>
    <rect x="120" y="150" width="26" height="34" fill="#2e2244" opacity="0.6"/>
