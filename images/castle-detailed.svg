<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fa3d8"/>
      <stop offset="45%" stop-color="#a9c9e8"/>
      <stop offset="100%" stop-color="#f4ead2"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6da" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a2230"/>
      <stop offset="45%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#6b1620"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6cf"/>
      <stop offset="100%" stop-color="#cdb999"/>
    </linearGradient>
    <linearGradient id="stoneGradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c9a8"/>
      <stop offset="100%" stop-color="#b39d7a"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a8fc9" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="archWin" width="60" height="90" patternUnits="userSpaceOnUse">
      <path d="M18,90 L18,50 Q18,34 30,34 Q42,34 42,50 L42,90 Z" fill="#2a2035" opacity="0.55"/>
    </pattern>

    <!-- 재사용 첨탑 (기본 크기: 폭70 높이200, 첨단이 원점) -->
    <g id="spire-tpl">
      <path d="M0,0 L35,140 Q35,152 24,152 L-24,152 Q-35,152 -35,140 Z" fill="url(#roofGrad)"/>
      <path d="M0,4 L0,150" stroke="#4a0f1a" stroke-width="2"/>
      <rect x="-36" y="146" width="72" height="9" fill="#7a1f2a"/>
      <rect x="-27" y="155" width="54" height="52" fill="url(#stoneGrad)"/>
      <rect x="-27" y="155" width="54" height="6" fill="#b39d7a"/>
      <path d="M-8,207 L-8,187 Q-8,178 0,178 Q8,178 8,187 L8,207 Z" fill="#2a2035"/>
      <circle cx="0" cy="-8" r="6.5" fill="#f4e3b0"/>
      <circle cx="0" cy="-8" r="6.5" fill="none" stroke="#c9a35a" stroke-width="1.5"/>
    </g>

    <!-- 재사용 아치창 -->
    <g id="win-tpl">
      <path d="M0,40 L0,12 Q0,0 12,0 Q24,0 24,12 L24,40 Z" fill="#241c30"/>
      <path d="M0,40 L0,12 Q0,0 12,0 Q24,0 24,12 L24,40 Z" fill="none" stroke="#8a7550" stroke-width="1.5"/>
    </g>

    <!-- 빙그레우스 픽셀 캐릭터 — 전신 (16x42) -->
    <g id="char-binggraeus">
      <rect x="6" y="0" width="4" height="3" fill="#f4c968"/>
      <rect x="2" y="3" width="12" height="3" fill="#f4c968"/>
      <rect x="6" y="1" width="4" height="2" fill="#e0483c"/>
      <rect x="0" y="6" width="16" height="2" fill="#c9a35a"/>
      <rect x="0" y="8" width="16" height="14" fill="#6b1f2a"/>
      <rect x="3" y="10" width="10" height="10" fill="#f2c9a0"/>
      <rect x="2" y="8" width="3" height="5" fill="#6b1f2a"/>
      <rect x="11" y="8" width="3" height="5" fill="#6b1f2a"/>
      <rect x="3" y="14" width="4" height="2" fill="#1a1a1a"/>
      <rect x="9" y="14" width="4" height="2" fill="#1a1a1a"/>
      <rect x="7" y="14" width="2" height="1" fill="#1a1a1a"/>
      <rect x="1" y="22" width="14" height="6" fill="#8c1f2a"/>
      <rect x="6" y="22" width="4" height="3" fill="#f2c9a0"/>
      <rect x="1" y="28" width="14" height="8" fill="#7a1c26"/>
      <rect x="2" y="36" width="5" height="6" fill="#241a2e"/>
      <rect x="9" y="36" width="5" height="6" fill="#241a2e"/>
    </g>

    <!-- 인어공주 픽셀 캐릭터 — 전신 (16x42) -->
    <g id="char-mermaid">
      <rect x="1" y="0" width="14" height="6" fill="#e8a94a"/>
      <rect x="0" y="6" width="4" height="11" fill="#e8a94a"/>
      <rect x="12" y="6" width="4" height="11" fill="#e8a94a"/>
      <rect x="4" y="6" width="8" height="8" fill="#f2c9a0"/>
      <rect x="5" y="10" width="2" height="1" fill="#1a1a1a"/>
      <rect x="9" y="10" width="2" height="1" fill="#1a1a1a"/>
      <rect x="3" y="14" width="10" height="6" fill="#2a8a8a"/>
      <rect x="2" y="20" width="12" height="14" fill="#1f6f6f"/>
      <rect x="4" y="34" width="8" height="6" fill="#175a5a"/>
      <rect x="0" y="38" width="6" height="4" fill="#175a5a"/>
      <rect x="10" y="38" width="6" height="4" fill="#175a5a"/>
    </g>
  </defs>

  <!-- 하늘 -->
  <rect x="0" y="0" width="500" height="1600" fill="url(#sky)"/>
  <circle cx="70" cy="90" r="220" fill="url(#sun)"/>

  <!-- 구름 -->
  <g fill="#ffffff" opacity="0.8" filter="url(#soft)">
    <ellipse cx="60" cy="230" rx="90" ry="30"/>
    <ellipse cx="430" cy="170" rx="110" ry="34"/>
    <ellipse cx="440" cy="340" rx="80" ry="26"/>
    <ellipse cx="40" cy="400" rx="70" ry="22"/>
    <ellipse cx="250" cy="120" rx="60" ry="18"/>
  </g>

  <!-- ===== 스카이라인: 첨탑 5개 ===== -->
  <use href="#spire-tpl" transform="translate(90,230) scale(0.62)"/>
  <use href="#spire-tpl" transform="translate(410,230) scale(0.62)"/>
  <use href="#spire-tpl" transform="translate(160,150) scale(0.82)"/>
  <use href="#spire-tpl" transform="translate(340,150) scale(0.82)"/>
  <use href="#spire-tpl" transform="translate(250,30) scale(1.15)"/>

  <!-- ===== 상단 성벽 타워 (좁은 단) ===== -->
  <rect x="150" y="360" width="200" height="170" fill="url(#stoneGrad)"/>
  <rect x="150" y="360" width="200" height="10" fill="#e8d9b8"/>
  <g fill="#e8d9b8">
    <rect x="150" y="348" width="16" height="20"/>
    <rect x="176" y="348" width="16" height="20"/>
    <rect x="202" y="348" width="16" height="20"/>
    <rect x="282" y="348" width="16" height="20"/>
    <rect x="308" y="348" width="16" height="20"/>
    <rect x="334" y="348" width="16" height="20"/>
  </g>
  <use href="#win-tpl" transform="translate(214,400) scale(1.1)"/>
  <use href="#win-tpl" transform="translate(266,400) scale(1.1)"/>

  <!-- ===== 좌우 보조 첨탑(허리께) ===== -->
  <use href="#spire-tpl" transform="translate(120,440) scale(0.5)"/>
  <use href="#spire-tpl" transform="translate(380,440) scale(0.5)"/>

  <!-- ===== 중단 벽 (넓은 단) — 측면 보조 타워 ===== -->
  <rect x="70" y="530" width="110" height="860" fill="url(#stoneGradDark)"/>
  <rect x="320" y="530" width="110" height="860" fill="url(#stoneGradDark)"/>
  <g fill="#e8d9b8">
    <rect x="70" y="516" width="16" height="20"/>
    <rect x="96" y="516" width="16" height="20"/>
    <rect x="122" y="516" width="16" height="20"/>
    <rect x="148" y="516" width="16" height="20"/>
    <rect x="164" y="516" width="16" height="20"/>
    <rect x="314" y="516" width="16" height="20"/>
    <rect x="336" y="516" width="16" height="20"/>
    <rect x="362" y="516" width="16" height="20"/>
    <rect x="388" y="516" width="16" height="20"/>
    <rect x="414" y="516" width="16" height="20"/>
  </g>
  <rect x="70" y="560" width="110" height="830" fill="url(#archWin)"/>
  <rect x="320" y="560" width="110" height="830" fill="url(#archWin)"/>

  <!-- ===== 중앙 본채 (컷어웨이 방이 들어가는 넓은 중심부) ===== -->
  <rect x="180" y="530" width="140" height="860" fill="#2a2035"/>
  <rect x="180" y="516" width="140" height="14" fill="#e8d9b8"/>

  <!-- Room A — 실제 콘텐츠 1 (아치형 컷어웨이) y 570-800 -->
  <g class="pixel-window" data-floor="binggrae" data-slot="floor-binggrae">
    <path d="M186,800 L186,610 Q186,570 250,570 Q314,570 314,610 L314,800 Z" fill="#3a2712"/>
    <path d="M186,800 L186,610 Q186,570 250,570 Q314,570 314,610 L314,800 Z" fill="none" stroke="#8a7550" stroke-width="4"/>
    <rect x="200" y="740" width="52" height="9" fill="#5c3d1c"/>
    <rect x="205" y="749" width="5" height="24" fill="#4a3018"/>
    <rect x="242" y="749" width="5" height="24" fill="#4a3018"/>
    <rect x="208" y="722" width="34" height="17" fill="#e8d4a0" opacity="0.9"/>
    <use href="#char-binggraeus" transform="translate(258,676) scale(2.6)"/>
    <rect x="186" y="792" width="128" height="8" fill="#5c3d1c"/>
  </g>

  <!-- Room B (공실) y 830-1010 -->
  <g class="pixel-window" data-floor="vacant">
    <path d="M186,1010 L186,860 Q186,830 250,830 Q314,830 314,860 L314,1010 Z" fill="#241c30"/>
    <path d="M186,1010 L186,860 Q186,830 250,830 Q314,830 314,860 L314,1010 Z" fill="none" stroke="#6b5c3e" stroke-width="4"/>
    <ellipse cx="250" cy="930" rx="34" ry="46" fill="#2e2542" opacity="0.6"/>
  </g>

  <!-- Room C — 실제 콘텐츠 2 (아치형 컷어웨이) y 1040-1270 -->
  <g class="pixel-window" data-floor="mermaid" data-slot="floor-mermaid">
    <path d="M186,1270 L186,1080 Q186,1040 250,1040 Q314,1040 314,1080 L314,1270 Z" fill="#123a3a"/>
    <path d="M186,1270 L186,1080 Q186,1040 250,1040 Q314,1040 314,1080 L314,1270 Z" fill="none" stroke="#5fb3b3" stroke-width="4"/>
    <g fill="#0d2a2a">
      <rect x="262" y="1070" width="20" height="20"/>
      <rect x="286" y="1070" width="20" height="20"/>
      <rect x="262" y="1094" width="20" height="20"/>
      <rect x="286" y="1094" width="20" height="20"/>
    </g>
    <use href="#char-mermaid" transform="translate(196,1140) scale(2.6)"/>
    <rect x="186" y="1262" width="128" height="8" fill="#0d2a2a"/>
  </g>

  <!-- Room D (공실, 입주 예정) y 1300-1480 -->
  <g class="pixel-window" data-floor="vacant">
    <path d="M186,1480 L186,1330 Q186,1300 250,1300 Q314,1300 314,1330 L314,1480 Z" fill="#241c30"/>
    <path d="M186,1480 L186,1330 Q186,1300 250,1300 Q314,1300 314,1330 L314,1480 Z" fill="none" stroke="#6b5c3e" stroke-width="4"/>
    <ellipse cx="250" cy="1400" rx="34" ry="46" fill="#2e2542" opacity="0.6"/>
  </g>

  <!-- ===== 아치 정문 + 다리 ===== -->
  <path d="M195,1600 L195,1500 Q195,1450 250,1450 Q305,1450 305,1500 L305,1600 Z" fill="#1a1420"/>
  <path d="M195,1600 L195,1500 Q195,1450 250,1450 Q305,1450 305,1600 L195,1600 Z" fill="none" stroke="#8a7550" stroke-width="5" opacity="0.7"/>
  <rect x="130" y="1560" width="240" height="14" fill="#b39d7a"/>
  <rect x="150" y="1574" width="200" height="14" fill="#a08960"/>
  <rect x="170" y="1588" width="160" height="12" fill="#8a7550"/>

  <!-- 폭포 -->
  <rect x="88" y="1490" width="20" height="110" fill="url(#waterGrad)"/>
  <rect x="392" y="1490" width="20" height="110" fill="url(#waterGrad)"/>
  <ellipse cx="98" cy="1600" rx="30" ry="10" fill="#bfe3f2" opacity="0.7"/>
  <ellipse cx="402" cy="1600" rx="30" ry="10" fill="#bfe3f2" opacity="0.7"/>
</svg>
