<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>선진이 포폴 — 하나의 성</title>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <div id="rotate-notice">
    <div class="rotate-icon">↻</div>
    <p>가로로 돌려주세요</p>
  </div>

  <button id="home-btn" title="로비로 돌아가기" aria-label="로비로 돌아가기">🏰</button>
  <button id="ambience-btn" title="앰비언스 사운드" aria-label="앰비언스 사운드">🔈</button>
  <div id="floor-indicator"></div>

  <main id="app">

    <!-- LOBBY -->
    <section id="view-lobby" class="view active">
      <div class="tower">
        <div class="tower-layer l1"></div>
        <div class="tower-layer l2"></div>
        <div class="tower-layer l3"></div>
        <div class="tower-glow"></div>
      </div>
      <div class="lobby-copy">
        <p class="prompt">↑ / ↓ 방향키를 눌러 탐험해보세요</p>
      </div>
    </section>

    <!-- TRANSITION -->
    <section id="view-transition" class="view">
      <div class="slices">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </section>

    <!-- PROJECT CHAMBER -->
    <section id="view-chamber" class="view">

      <!-- video-format chamber -->
      <div id="chamber-video" class="chamber-type video-chamber">

        <div class="video-hero">
          <video id="hero-video" class="hero-video" muted loop playsinline autoplay></video>
          <button id="hero-mute" class="hero-mute" aria-label="소리 켜기/끄기">🔇</button>
          <div class="hero-overlay" id="hero-overlay">
            <p class="eyebrow" id="video-eyebrow"></p>
            <h2 id="video-title"></h2>
          </div>
          <button id="wn-cta" class="wn-cta">
            Working Note <span class="wn-cta-arrow">⌄</span>
          </button>
        </div>

        <div id="working-notes" class="notes-section">
          <div class="notes-inner">
            <p class="eyebrow">기획의도</p>
            <div class="meta-grid">
              <div><span class="meta-label">ISSUE</span><p id="wn-issue"></p></div>
              <div><span class="meta-label">SOLUTION</span><p id="wn-solution"></p></div>
            </div>

            <p class="eyebrow notes-copy-label">카피라이팅</p>
            <div class="credits" id="wn-script"></div>
          </div>
        </div>

      </div>

      <!-- sns-format chamber -->
      <div id="chamber-sns" class="chamber-type">
        <div class="chamber-label">
          <p class="eyebrow" id="sns-eyebrow"></p>
          <h2 id="sns-title"></h2>
        </div>

        <div class="carousel" id="sns-carousel"></div>
        <p class="hint">← / → 로 게시물 탐색, 클릭하면 카피 전체 보기</p>

        <div id="sns-detail" class="panel">
          <button class="panel-close" id="sns-close" aria-label="닫기">✕</button>
          <div class="panel-inner sns-detail-inner">
            <div class="sns-detail-image" id="sns-detail-image"></div>
            <p class="sns-detail-caption" id="sns-detail-caption"></p>
          </div>
        </div>
      </div>

    </section>

  </main>

  <script src="script.js?v=3"></script>
</body>
</html>
